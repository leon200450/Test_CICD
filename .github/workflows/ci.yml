name: CI Test

on:
  push:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build -o main.exe ./cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-exe
          path: main.exe
          retention-days: 7
